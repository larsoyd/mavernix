# Desktop portal backends for this session (XDG_CURRENT_DESKTOP=wayfire).
# GTK supplies settings, KDE supplies file dialogs, and wlroots supplies capture.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=kde;gtk
# Screen capture needs the compositor's own backend.
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
